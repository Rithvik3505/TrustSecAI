model:
  base_model_name: "meta-llama/Llama-3.1-8B-Instruct"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  load_in_4bit: true
  use_gradient_checkpointing: true

data:
  train_file: "artifacts/training/datasets/train_sft.jsonl"
  validation_file: "artifacts/training/datasets/validation_sft.jsonl"
  test_file: "artifacts/training/datasets/test_sft.jsonl"
  compact_train_file: "artifacts/training/datasets/train_sft_compact.jsonl"
  compact_validation_file: "artifacts/training/datasets/validation_sft_compact.jsonl"
  compact_test_file: "artifacts/training/datasets/test_sft_compact.jsonl"
  text_field: "text"
  max_seq_length: 8192

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "models/lora/trustsecai_lora_v1"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3
  evaluation_strategy: "steps"
  save_strategy: "steps"
  report_to: "none"
  seed: 42

dry_run:
  output_dir: "models/lora/trustsecai_lora_v1_dry_run"
  train_file: "artifacts/training/datasets/train_sft_tiny.jsonl"
  validation_file: "artifacts/training/datasets/validation_sft_tiny.jsonl"
  max_steps: 5
